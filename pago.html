<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Procesar pago | Pastelería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <header class="bg-light border-bottom">
        <div class="container py-3">
            <h1 class="h3 mb-0">Procesar pago</h1>
            <p class="text-muted mb-0">
                Complete la información para confirmar su pedido.
            </p>
        </div>
    </header>

    <main class="container my-5">

        <div class="row g-4">

            <!-- Información del cliente -->
            <section class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="h4 mb-4">
                            Información del cliente
                        </h2>

                        <form id="formularioPago">

                            <div class="mb-3">
                                <label for="nombre"
                                       class="form-label">
                                    Nombre completo
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="correo"
                                       class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="correo"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="telefono"
                                       class="form-label">
                                    Teléfono
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       id="telefono"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="direccion"
                                       class="form-label">
                                    Dirección de entrega
                                </label>

                                <textarea class="form-control"
                                          id="direccion"
                                          rows="3"
                                          required></textarea>
                            </div>

                        </form>

                    </div>

                </div>

            </section>

            <!-- Resumen del pedido -->
            <aside class="col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="h4 mb-4">
                            Resumen del pedido
                        </h2>

                        <div class="d-flex justify-content-between">
                            <span>Subtotal</span>
                            <span>₡0</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between fw-bold">
                            <span>Total</span>
                            <span>₡0</span>
                        </div>

                        <button type="button"
                                class="btn btn-primary w-100 mt-4">
                            Continuar
                        </button>

                    </div>

                </div>

            </aside>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
