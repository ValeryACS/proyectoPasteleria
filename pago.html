<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Procesar pago | Pastelería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/pago.css">
</head>

<body>

    <header class="bg-light border-bottom">
        <div class="container py-3">
            <h1 class="h3 mb-0">Procesar pago</h1>
            <p class="text-muted mb-0">
                Complete la información para confirmar su pedido.
            </p>
        </div>
    </header>

    <main class="container my-5">

        <div class="row g-4">

            <!-- Información del cliente -->
            <section class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="h4 mb-4">
                            Información del cliente
                        </h2>

                        <form id="formularioPago">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre completo
                                </label>

                                <input type="text" class="form-control" id="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>

                                <input type="email" class="form-control" id="correo" required>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">
                                    Teléfono
                                </label>

                                <input type="tel" class="form-control" id="telefono" required>
                            </div>

                            <div class="mb-3">
                                <label for="direccion" class="form-label">
                                    Dirección de entrega
                                </label>

                                <textarea class="form-control" id="direccion" rows="3" required></textarea>
                            </div>

                        </form>
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                Método de pago
                            </label>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="metodoPago" id="pagoTarjeta"
                                    value="tarjeta" checked>

                                <label class="form-check-label" for="pagoTarjeta">
                                    Tarjeta
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="metodoPago" id="pagoSinpe"
                                    value="sinpe">

                                <label class="form-check-label" for="pagoSinpe">
                                    SINPE Móvil
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="metodoPago" id="pagoPaypal"
                                    value="paypal">

                                <label class="form-check-label" for="pagoPaypal">
                                    PayPal
                                </label>
                            </div>
                        </div>

                        <div id="camposTarjeta">
                            <div class="mb-3">
                                <label for="titular" class="form-label">
                                    Nombre del titular
                                </label>

                                <input type="text" class="form-control" id="titular">
                            </div>

                            <div class="mb-3">
                                <label for="numeroTarjeta" class="form-label">
                                    Número de tarjeta
                                </label>

                                <input type="text" class="form-control" id="numeroTarjeta" maxlength="19"
                                    placeholder="0000 0000 0000 0000">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="vencimiento" class="form-label">
                                        Vencimiento
                                    </label>

                                    <input type="text" class="form-control" id="vencimiento" maxlength="5"
                                        placeholder="MM/AA">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="cvv" class="form-label">
                                        CVV
                                    </label>

                                    <input type="password" class="form-control" id="cvv" maxlength="4"
                                        placeholder="123">
                                </div>
                            </div>
                        </div>

                        <div id="camposSinpe" class="alert alert-light border d-none">
                            <strong>SINPE Móvil</strong>
                            <p class="mb-2">
                                Realice el pago al número 8888-8888.
                            </p>

                            <label for="comprobante" class="form-label">
                                Número de comprobante
                            </label>

                            <input type="text" class="form-control" id="comprobante">
                        </div>

                        <div id="camposPaypal" class="alert alert-light border d-none">
                            <strong>PayPal</strong>
                            <p class="mb-0">
                                Al confirmar, será dirigido a la simulación de pago con PayPal.
                            </p>
                        </div>
                    </div>

                </div>

            </section>

            <!-- Resumen del pedido -->
            <aside class="col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="h4 mb-4">
                            Resumen del pedido
                        </h2>

                        <div class="d-flex justify-content-between">
                            <span>Subtotal</span>
                            <span>₡0</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between fw-bold resumen-total">
                            <span>₡0</span>
                        </div>

                        <button type="button" id="btnConfirmarPago" class="btn btn-primary w-100 mt-4">
                            Confirmar pago
                        </button>

                    </div>

                </div>

            </aside>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/pago.js"></script>
</body>

</html>
