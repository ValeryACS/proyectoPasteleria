<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería Dulce Hogar - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="row vh-100 align-items-center">
            
            <!-- SECCIÓN DE LA IMAGEN LATERAL (Oculta en pantallas pequeñas) -->
            <div class="col-lg-6 text-center d-none d-lg-block">
                <img src="img/banner.png" class="img-fluid" style="max-height: 550px;" alt="Banner Panadería">
            </div>

            <!-- SECCIÓN DEL FORMULARIO DE LOGIN -->
            <div class="col-lg-6">
                <div class="login-card p-4">
                    
                    <!-- Encabezado del Formulario -->
                    <div class="text-center mb-4">
                        <h1>Dulce Hogar</h1>
                        <p class="text-muted">Horneando momentos dulces para ti.</p>
                    </div>

                    <!-- Input: Usuario -->
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control" placeholder="Ingrese su usuario">
                        </div>
                    </div>

                    <!-- Input: Contraseña -->
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" class="form-control" placeholder="Ingrese su contraseña">
                        </div>
                    </div>

                    <!-- Botón Ingresar -->
                    <button class="btn btn-rosa w-100" onclick="location.href='home.html'">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>

                    <!-- Sección: Registro / Crear Cuenta -->
                    <div class="text-center mt-4">
                        <p>¿No tienes una cuenta?</p>
                        <br>
                        <a href="registro.html" class="btn btn-outline-danger">
                            Crear cuenta
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- PROGRAMACIÓN JAVASCRIPT DEL CARRITO (Cargado en memoria desde el inicio) -->
    <script src="js/cart-front.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
