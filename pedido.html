<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pedido Personalizado - Dulce Hogar</title>


<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- Iconos -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<!-- CSS -->

<link rel="stylesheet" href="css/style.css">
 

</head>


<body>



<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

<div class="container">


<a class="navbar-brand" href="home.html">

🥐 Dulce Hogar

</a>



<div>

<a href="home.html"
class="btn btn-light">

<i class="bi bi-house-fill"></i>

Inicio

</a>


</div>


</div>

</nav>







<!-- FORMULARIO -->


<div class="container mt-5">


<div class="hero">


<div class="text-center mb-4">


<h2>

✨ Pedido Personalizado

</h2>


<p>

Cuéntanos cómo imaginas tu postre ideal 💕

</p>


</div>





<div class="row">



<!-- COLUMNA IZQUIERDA -->


<div class="col-md-6">



<div class="mb-3">


<label class="form-label">

<i class="bi bi-cake2-fill"></i>

Tipo de producto

</label>


<select class="form-control">


<option>

Seleccione una opción

</option>


<option>

Torta

</option>


<option>

Cupcakes

</option>


<option>

Galletas decoradas

</option>


<option>

Pan especial

</option>


</select>


</div>





<div class="mb-3">


<label class="form-label">

Sabor

</label>


<input type="text"
class="form-control"
placeholder="Ejemplo: Chocolate, vainilla, fresa...">


</div>






<div class="mb-3">


<label class="form-label">

Tamaño o cantidad

</label>


<input type="text"
class="form-control"
placeholder="Ejemplo: 20 personas, 12 cupcakes...">


</div>





<div class="mb-3">


<label class="form-label">

Fecha de entrega

</label>


<input type="date"
class="form-control">


</div>



</div>







<!-- COLUMNA DERECHA -->


<div class="col-md-6">


<div class="mb-3">


<label class="form-label">

🎨 Decoración deseada

</label>


<textarea
class="form-control"
rows="4"
placeholder="Describe los colores, diseño o temática..."></textarea>


</div>





<div class="mb-3">


<label class="form-label">

💌 Mensaje especial

</label>


<textarea
class="form-control"
rows="4"
placeholder="Ejemplo: Feliz cumpleaños Ana"></textarea>


</div>






<div class="mb-3">


<label class="form-label">

Observaciones adicionales

</label>


<textarea
class="form-control"
rows="3"
placeholder="Algún detalle adicional..."></textarea>


</div>



</div>




</div>







<button

class="btn btn-rosa w-100 mt-4"

onclick="confirmarPedido()">

<i class="bi bi-send-fill"></i>

Enviar pedido


</button>






</div>


</div>







<footer>


<h4>

🥐 Dulce Hogar

</h4>


<p>

Gracias por elegirnos para crear momentos especiales 💕

</p>


</footer>








<script src="js/app.js"></script>


</body>

</html>
